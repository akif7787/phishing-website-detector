services:
  - type: web
    name: phishguard-backend
    env: python
    buildCommand: "pip install -r requirements.txt"
    startCommand: "gunicorn app:app --workers 2 --threads 4 --timeout 60"
    plan: free
    envVars:
      - key: FLASK_ENV
        value: production
      - key: DATABASE_PATH
        value: /tmp/analysis_history.db
