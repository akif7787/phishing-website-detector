# Netlify Configuration for PhishGuard Static Frontend
[build]
  publish = "public"

# Proxy /api requests to Render Flask backend
[[redirects]]
  from = "/api/*"
  to = "https://phishguard-backend-s1sx.onrender.com/api/:splat"
  status = 200
  force = true

# Single Page App routing fallback
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-XSS-Protection = "1; mode=block"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
